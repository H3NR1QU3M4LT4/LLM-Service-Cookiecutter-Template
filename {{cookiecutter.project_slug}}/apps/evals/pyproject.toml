[project]
name = "{{ cookiecutter.project_slug }}-evals"
version = "0.1.0"
description = "Offline evals: compare models and prompt versions on a dataset (checks, LLM-as-judge, latency, tokens, cost)"
requires-python = ">={{ cookiecutter.python_version }}"
# Same LLM stack as apps/backend, whose code (LLMClient, prompts, models) the runner imports from ../backend/src.
dependencies = [
    "semantic-kernel[ollama]>=1.47.0",
    "azure-identity>=1.19.0",
    "pydantic-settings>=2.6.0",
    "tenacity>=9.0.0",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13.0",
    "pylint>=4.0.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.16.6",
    "types-pyyaml>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../backend/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov=evals --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
omit = ["evals/cli.py", "evals/__main__.py"]

[tool.mypy]
strict = true
files = ["evals", "tests"]
mypy_path = "../backend/src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pylint.main]
py-version = "{{ cookiecutter.python_version }}"
jobs = 0
source-roots = [".", "../backend/src"]
init-hook = "import sys; sys.path[:0] = ['.', '../backend/src']"

[tool.pylint.format]
max-line-length = 120

[tool.pylint."messages control"]
disable = [
    "C0114", "C0115", "C0116",  # docstrings: enforced by ruff D on public code
    "C0301",  # line-too-long: ruff format owns line length
    "C0415",  # import-outside-toplevel: lazy imports are deliberate
    "R0902", "R0903",  # records and pydantic models
    "R0913", "R0917",  # keyword options with defaults
    "R0914",  # too-many-locals
]
