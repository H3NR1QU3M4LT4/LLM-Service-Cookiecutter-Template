line-length = 120
src = ["src"]
target-version = "py{{ cookiecutter.python_version.replace('.', '') }}"

[lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "D"]
ignore = ["D203", "D213", "D100", "D104"]

[lint.per-file-ignores]
"tests/*" = ["ANN", "D"]

[lint.pydocstyle]
convention = "google"
